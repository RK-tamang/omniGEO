[package]
name = "answerscope-integrations"
version.workspace = true
edition.workspace = true
[dependencies]
answerscope-core = { path = "../core" }
answerscope-ai-visibility = { path = "../ai-visibility" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
