[package]
name = "answerscope-crawling"
version.workspace = true
edition.workspace = true

[dependencies]
axum = { version = "0.8", features = ["macros"] }
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
http = "1.1"
ipnet = "2.11"
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "stream"] }
scraper = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "time", "net", "sync"] }
tracing = "0.1"
url = "2.5"
uuid = { version = "1.12", features = ["v4", "serde"] }
answerscope-core = { path = "../core" }
answerscope-error = { path = "../error" }
answerscope-web-intelligence = { path = "../web-intelligence" }

[dev-dependencies]
serde_json = "1.0"
