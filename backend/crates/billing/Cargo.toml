[package]
name = "answerscope-billing"
version.workspace = true
edition.workspace = true
[dependencies]
answerscope-core = { path = "../core" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.12", features = ["v4", "serde"] }
