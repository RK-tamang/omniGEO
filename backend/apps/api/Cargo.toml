[package]
name = "answerscope-api"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
bcrypt = "0.9"
base64 = "0.22"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures-util = "0.3"
http = "1.3"
ipnet = "2.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "stream"] }
quick-xml = "0.37"
scraper = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
utoipa = "5"
tower-http = { version = "0.6", features = ["cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1.12", features = ["v4", "serde"] }
answerscope-core = { path = "../../crates/core" }
answerscope-config = { path = "../../crates/config" }
answerscope-error = { path = "../../crates/error" }
answerscope-api-contracts = { path = "../../crates/api-contracts" }
answerscope-web-intelligence = { path = "../../crates/web-intelligence" }
answerscope-geo-audit = { path = "../../crates/geo-audit" }
answerscope-persistence = { path = "../../crates/persistence" }
answerscope-integrations = { path = "../../crates/integrations" }
answerscope-ai-visibility = { path = "../../crates/ai-visibility" }
answerscope-billing = { path = "../../crates/billing" }
answerscope-entitlements = { path = "../../crates/entitlements" }
answerscope-metering = { path = "../../crates/metering" }
answerscope-crawling = { path = "../../crates/crawling" }
hmac = "0.12"
hex = "0.4"
answerscope-reporting = { path = "../../crates/reporting" }
answerscope-observability = { path = "../../crates/observability" }
sha2 = "0.10"

[dev-dependencies]
assert_matches = "1.5"
futures = "0.3"
